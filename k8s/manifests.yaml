# ============================================================
# notara-data / k8s / manifests.yaml
# Infraestructura de datos: PostgreSQL x4, MongoDB, Redis, RabbitMQ
# Namespace propio: notara-data
# ============================================================

# ── Namespace ──────────────────────────────────────────────
apiVersion: v1
kind: Namespace
metadata:
  name: notara-data
  labels:
    project: notara
    layer: data

---
# ── Secret: credenciales de PostgreSQL ────────────────────
# Valores en base64: echo -n "postgres" | base64  → cG9zdGdyZXM=
#                   echo -n "password" | base64  → cGFzc3dvcmQ=
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: notara-data
type: Opaque
data:
  POSTGRES_USER: cG9zdGdyZXM=
  POSTGRES_PASSWORD: cGFzc3dvcmQ=

---
# ══════════════════════════════════════════════════════════
# POSTGRESQL — notara-usuarios-db (puerto interno 5432)
# ══════════════════════════════════════════════════════════
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-usuarios
  namespace: notara-data
  labels:
    app: postgres-usuarios
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres-usuarios
  template:
    metadata:
      labels:
        app: postgres-usuarios
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: notara-usuarios-db
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "300m"
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 5
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-usuarios-svc
  namespace: notara-data
spec:
  selector:
    app: postgres-usuarios
  ports:
    - port: 5432
      targetPort: 5432
  type: ClusterIP

---
